name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pausalac
          POSTGRES_USER: pausalac
          POSTGRES_PASSWORD: pausalac
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pausalac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - name: Run tests
        env:
          DATABASE_URL: postgres://pausalac:pausalac@localhost:5432/pausalac
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pausalac/app run lint
      - run: pnpm --filter @pausalac/app run build
      - run: pnpm --filter @pausalac/web exec nuxt build
