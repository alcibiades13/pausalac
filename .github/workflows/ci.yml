name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pausalac
          POSTGRES_USER: pausalac
          POSTGRES_PASSWORD: pausalac
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pausalac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - name: Check for missing migrations
        env:
          DATABASE_URL: postgres://pausalac:pausalac@localhost:5432/pausalac
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        env:
          DATABASE_URL: postgres://pausalac:pausalac@localhost:5432/pausalac
        run: pytest
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements/base.txt --skip-editable
        continue-on-error: true # known-vuln advisories shouldn't block CI on day one; surfaced, not enforced yet

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pausalac/app run lint
      - run: pnpm --filter @pausalac/app run type-check
      - run: pnpm --filter @pausalac/app run test:unit -- --run
      - run: pnpm --filter @pausalac/app run build
      - run: pnpm --filter @pausalac/web exec nuxt build
      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # surfaced, not enforced yet — same reasoning as the backend's pip-audit step

  e2e:
    name: E2E (Playwright, real stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend] # don't spend E2E minutes on a commit that already fails lint/unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pausalac/app exec playwright install --with-deps chromium
      - run: cp .env.example .env
      - name: Start infrastructure (Postgres, Redis, MinIO, MailHog)
        run: docker compose up -d --wait
      - name: Install backend deps and migrate
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements/dev.txt
          .venv/bin/python manage.py migrate
      - name: Start Django, Celery, and Vite in the background
        run: |
          (cd apps/api && .venv/bin/python manage.py runserver &)
          (cd apps/api && .venv/bin/celery -A config worker -B -l info &)
          (pnpm --filter @pausalac/app dev &)
      - name: Wait for both dev servers
        run: |
          npx wait-on http://localhost:8000/health http://localhost:5173 --timeout 60000
      - run: pnpm --filter @pausalac/app run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 7
