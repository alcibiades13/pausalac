name: pausalac

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pausalac}
      POSTGRES_USER: ${POSTGRES_USER:-pausalac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pausalac}
    ports:
      # Host-side port only — many dev machines already run a native
      # Postgres on 5432. Must match POSTGRES_PORT in .env.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pausalac}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host-side port only — many dev machines already run a native
      # Redis on 6379. Must match the port in REDIS_URL/CELERY_BROKER_URL
      # in .env.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio on Docker Hub is no longer pullable (MinIO moved
    # distribution off Hub) — quay.io is the current official source.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-pausalac}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-pausalac_local_secret}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
