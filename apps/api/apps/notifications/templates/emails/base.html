<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pausalac</title>
</head>
<body style="margin:0;padding:0;background:#f7f8fa;font-family:'DejaVu Sans','Helvetica Neue',Arial,sans-serif;color:#172033;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8fa;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;max-width:480px;">
          <tr>
            <td style="background:#0d9488;padding:20px 32px;">
              <span style="color:#ffffff;font-size:18px;font-weight:600;">Pausalac</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 24px;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;">
              Ovaj email je automatski poslat sa Pausalac platforme.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
