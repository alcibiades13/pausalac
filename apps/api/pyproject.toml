[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django's `startapp` boilerplate imports (models/views/admin/tests) are
# scaffolding for Phase 1b+ domain code, not unused code to delete now.
"apps/*/models.py" = ["F401"]
"apps/*/views.py" = ["F401"]
"apps/*/admin.py" = ["F401"]
"apps/*/tests.py" = ["F401"]
# Environment settings modules deliberately `from .base import *` — the
# standard Django multi-settings pattern — so names look "undefined" to ruff.
"config/settings/dev.py" = ["F403", "F405"]
"config/settings/staging.py" = ["F403", "F405"]
"config/settings/production.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405"]
